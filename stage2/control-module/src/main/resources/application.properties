# Control Module defaults. Environment variables of the same name take precedence.
PORT=7000
CONTROL_DB_PATH=data/state/control.db
# Replicas of each service, comma-separated, used in rotation with failover.
INGESTION_URLS=http://localhost:7001
INDEXING_URLS=http://localhost:7002
SEARCH_URLS=http://localhost:7003
# Threads that drive tasks. This is the pipeline's concurrency across books.
CONTROL_WORKERS=4
# Wait between looks at the task table when no task is ready.
CONTROL_POLL_MS=50
# Longer than the Indexing Service's SQLITE_BUSY_TIMEOUT_MS, so that its 503 arrives first.
INGEST_TIMEOUT_MS=60000
INDEX_TIMEOUT_MS=60000
PUBLISH_CHECK_TIMEOUT_MS=5000
# A task whose worker died can be claimed again after this long.
TASK_LEASE_MS=180000
# Retries of one step before the task becomes FAILED, with exponential backoff.
MAX_ATTEMPTS=8
RETRY_BASE_MS=500
RETRY_MAX_MS=30000
SQLITE_BUSY_TIMEOUT_MS=10000
SQLITE_SYNCHRONOUS=FULL
