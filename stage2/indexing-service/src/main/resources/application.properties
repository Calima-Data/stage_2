# Indexing Service defaults. Environment variables of the same name take precedence.
PORT=7002
DATALAKE_PATH=data/datalake
DATAMART_PATH=data/datamart/search.db
# Replicas of the Ingestion Service, tried in rotation.
INGESTION_URLS=http://localhost:7001
INTERNAL_HTTP_TIMEOUT_MS=10000
# How long a write waits for the single SQLite write lock before answering 503.
SQLITE_BUSY_TIMEOUT_MS=30000
SQLITE_SYNCHRONOUS=FULL
SQLITE_POOL_SIZE=8
# Threads that parse books during POST /index/rebuild.
REBUILD_THREADS=4
