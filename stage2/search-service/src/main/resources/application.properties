# Search Service defaults. Environment variables of the same name take precedence.
PORT=7003
DATAMART_PATH=data/datamart/search.db
SQLITE_BUSY_TIMEOUT_MS=5000
# Read connections. A request waits for a free one, up to the busy timeout, and then gets 503.
SQLITE_POOL_SIZE=16
# Entries in the result cache; 0 disables it.
SEARCH_CACHE_SIZE=1000
