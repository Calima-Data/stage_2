# Ingestion Service defaults. Environment variables of the same name take precedence.
PORT=7001
DATALAKE_PATH=data/datalake
INGESTION_LEDGER_PATH=data/state/ingestion.db
GUTENBERG_URL_TEMPLATE=https://www.gutenberg.org/cache/epub/{id}/pg{id}.txt
DOWNLOAD_TIMEOUT_MS=30000
# An unfinished claim older than this may be taken over by another request or replica.
INGEST_LEASE_MS=120000
SQLITE_BUSY_TIMEOUT_MS=10000
SQLITE_SYNCHRONOUS=FULL
SQLITE_POOL_SIZE=8
